cargo-features = ["per-package-target"]

[package]
name = "watchy-rs"
version = "0.1.0"
authors = ["Alexander Lyon <arlyon@me.com>"]
edition = "2024"
resolver = "2"
rust-version = "1.85"
# forced-target = "xtensa-esp32s3-espidf"

[[bin]]
name = "watchy-rs"
harness = false

[lib]
crate-type = ["lib"]
harness = false

[dependencies]
epd-waveshare = { version = "0.6.0", git = "https://github.com/XLPhere/epd-waveshare.git", branch = "async", features = [
    "async",
] }
embedded-graphics = "0.8.1"
embassy-executor.workspace = true
esp-hal = { version = "1.0.0-beta.0", default-features = false, features = [
    "defmt",
    "esp32s3",
    "unstable",
] }
esp-hal-embassy = { version = "0.7.0", features = ["esp32s3"] }
embassy-sync.workspace = true
static_cell = { version = "2.1.0", features = ["nightly"] }
embassy-time = { version = "0.4.0" }
embassy-embedded-hal = "0.3.0"
esp-backtrace = { version = "0.15.1", features = [
    "panic-handler",
    "esp32s3",
    "defmt",
] }
defmt.workspace = true
embedded-hal.workspace = true
esp-println = { version = "0.13.1", default-features = false, features = [
    "defmt-espflash",
    "esp32s3",
    "jtag-serial",
] }
critical-section = "1.1.3"
embassy-futures = { version = "0.1.1", features = ["defmt"] }
bma423 = "0.0.4"
async-debounce = "0.2.0"
embedded-hal-async.workspace = true
either = { version = "1.13.0", default-features = false }
futures = { version = "0.3.30", default-features = false, features = [
    "async-await",
] }
pin-project-lite = "0.2.14"
embedded-nal-async = "0.8.0"
esp-wifi = { version = "0.13.0", features = ["esp32s3", "wifi", "defmt", "smoltcp"] }
reqwless = { version = "0.13.0", default-features = false, features = [
    "defmt",
] }
heapless = { version = "0.8.0", features = ["defmt-03", "ufmt"] }
embedded-svc = { version = "0.28.0", default-features = false, features = [
    "nightly",
] }
embassy-net = { version = "0.6.0", features = [
    "tcp",
    "dhcpv4",
    "medium-ethernet",
    "dns",
    "defmt",
    "udp",
] }
pin-utils = "0.1.0"
sntpc = { version = "0.5.2", default-features = false }
smoltcp = { version = "0.12.0", default-features = false, features = [
    "async",
    "defmt",
    "socket",
    "socket-udp",
] }
itoa = "1.0.11"
time = { version = "0.3.36", default-features = false }
embedded-fonts = { version = "0.1.0" }
ufmt = "0.2.0"
esp-alloc = { version = "0.7.0", features = ["nightly"] }
chrono = { version = "0.4.38", default-features = false }
xtensa-lx-rt = { version = "0.18.0", features = [
    "float-save-restore",
    "esp32s3",
] }

sticky-signal = { path = "../crates/sticky-signal" }
layered-lock = { path = "../crates/layered-lock" }

[dev-dependencies]
embedded-test = { version = "0.6.0", features = [
    "embassy",
    "defmt",
    "external-executor",
] }
semihosting = { version = "0.1.15", features = ["openocd-semihosting"] }
smol = "2.0.2"

# [[test]]
# name = "example_test"
# harness = false
